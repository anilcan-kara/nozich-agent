name: OSV-Scanner

on:
  workflow_dispatch:

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan lockfiles
    runs-on: [self-hosted, s31]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit dependencies
        run: bun audit || true